<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Downloader | Made By RP</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 40px 25px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
        }
        h1 {
            color: #222;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eaeaea;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #dc2743;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0095f6, #007bb5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 149, 246, 0.4);
        }
        #status-message {
            margin-top: 20px;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }
        #download-link {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #download-link:hover {
            background-color: #218838;
        }
        .credit {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Downloader</h1>
        <p>Paste an Instagram Reel link to download it instantly.</p>
        
        <input type="text" id="reel-url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
        <button onclick="downloadReel()">Fetch Video</button>

        <div id="status-message"></div>
        <a id="download-link" href="#" target="_blank" rel="noopener noreferrer">Save MP4 File</a>

        <div class="credit">Made By RP</div>
    </div>

    <script>
        // Recursive function to safely find the video URL no matter how the API structures its JSON
        function findVideoUrl(obj) {
            if (typeof obj !== 'object' || obj === null) return null;
            if (obj.video_url) return obj.video_url;
            if (obj.videoUrl) return obj.videoUrl;
            if (obj.video_versions && obj.video_versions.length > 0) return obj.video_versions[0].url;
            
            for (let key in obj) {
                const result = findVideoUrl(obj[key]);
                if (result) return result;
            }
            return null;
        }

        async function downloadReel() {
            const urlInput = document.getElementById('reel-url').value.trim();
            const statusMessage = document.getElementById('status-message');
            const downloadLink = document.getElementById('download-link');

            statusMessage.innerHTML = "";
            downloadLink.style.display = "none";

            // Extract the Shortcode (e.g., C0bxFxjvu_K) from the pasted URL
            const match = urlInput.match(/(?:reel|p)\/([a-zA-Z0-9_-]+)/);
            if (!match) {
                statusMessage.innerHTML = "❌ Please enter a valid Instagram link.";
                statusMessage.style.color = "#dc2743";
                return;
            }
            const shortcode = match[1];

            statusMessage.innerHTML = "✨ Fetching video... please wait.";
            statusMessage.style.color = "#0095f6";

            // Your exact RapidAPI credentials
            const apiKey = '3af37c462emsh434a1b283c4cf58p14bbcbjsn0c46596f8b0b';
            const apiHost = 'instagram-api-fast-reliable-data-scraper.p.rapidapi.com';
            const apiUrl = `https://${apiHost}/post?shortcode=${shortcode}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': apiKey,
                        'x-rapidapi-host': apiHost,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const data = await response.json();
                const videoUrl = findVideoUrl(data);

                if (videoUrl) {
                    statusMessage.innerHTML = "✅ Success! Your video is ready.";
                    statusMessage.style.color = "#28a745";
                    
                    downloadLink.href = videoUrl;
                    downloadLink.style.display = "inline-block";
                } else {
                    statusMessage.innerHTML = "❌ Video found, but no MP4 link was returned. It might be a photo post.";
                    statusMessage.style.color = "#dc2743";
                }
            } catch (error) {
                console.error("Fetch error:", error);
                statusMessage.innerHTML = "❌ Connection failed. Check your API limit on RapidAPI.";
                statusMessage.style.color = "#dc2743";
            }
        }
    </script>
</body>
</html>
