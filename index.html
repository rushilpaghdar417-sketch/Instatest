<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Downloader | Made By RP</title>
    <style>
        /* --- Styling for a beautiful UI --- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 40px 25px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
        }
        h1 {
            color: #222;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eaeaea;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #dc2743;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0095f6, #007bb5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 149, 246, 0.4);
        }
        #status-message {
            margin-top: 20px;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }
        #download-link {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #download-link:hover {
            background-color: #218838;
        }
        
        /* --- Your custom branding --- */
        .credit {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Downloader</h1>
        <p>Paste an Instagram Reel link to download it instantly.</p>
        
        <input type="text" id="reel-url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
        <button onclick="downloadReel()">Fetch Video</button>

        <div id="status-message"></div>
        <a id="download-link" href="#" target="_blank" rel="noopener noreferrer">Save MP4 File</a>

        <div class="credit">Made By RP</div>
    </div>

    <script>
        /* --- Robust Multi-Server Engine for GitHub Pages --- */
        async function downloadReel() {
            const urlInput = document.getElementById('reel-url').value.trim();
            const statusMessage = document.getElementById('status-message');
            const downloadLink = document.getElementById('download-link');

            statusMessage.innerHTML = "";
            downloadLink.style.display = "none";

            if (!urlInput.includes('instagram.com/')) {
                statusMessage.innerHTML = "❌ Please enter a valid Instagram link.";
                statusMessage.style.color = "#dc2743";
                return;
            }

            statusMessage.innerHTML = "✨ Fetching video... please wait.";
            statusMessage.style.color = "#0095f6";

            // A list of active community Cobalt servers that allow GitHub Pages connections
            const cobaltServers = [
                'https://api.cobalt.pequla.com/',
                'https://cobalt.q-n-d.de/',
                'https://cobalt.api.timelessnesses.me/'
            ];

            let success = false;

            // The code will try each server one by one until it finds a working one
            for (let serverUrl of cobaltServers) {
                try {
                    const response = await fetch(serverUrl, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ url: urlInput })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        
                        if (data && data.url) {
                            statusMessage.innerHTML = "✅ Success! Your video is ready.";
                            statusMessage.style.color = "#28a745";
                            
                            downloadLink.href = data.url;
                            downloadLink.style.display = "inline-block";
                            success = true;
                            break; // Stop looking for servers because we got the video
                        }
                    }
                } catch (error) {
                    console.warn(`Server ${serverUrl} failed, trying next...`);
                    // If this server fails, the loop automatically continues to the next one
                }
            }

            // If all servers in the list are down or blocked
            if (!success) {
                statusMessage.innerHTML = "❌ All servers are currently busy. Please try again in a few minutes.";
                statusMessage.style.color = "#dc2743";
            }
        }
    </script>
</body>
</html>
